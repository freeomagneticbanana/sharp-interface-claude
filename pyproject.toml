[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sharp-interface"
version = "0.1.0"
description = "2D sharp-interface solver for N-component alloy solidification"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]
jax = ["jax"]

[tool.setuptools.packages.find]
include = ["sharp_interface*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running convergence/benchmark tests"]
